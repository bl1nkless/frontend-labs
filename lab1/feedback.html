<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОБРІЙ — Зворотній зв’язок</title>
    <link rel="stylesheet" href="style.css">
    <script src="form.js" defer></script>
</head>
<body>
    <header>
        <img src="../assets/logo.svg" alt="Логотип корпорації ОБРІЙ" width="60" height="60">
        <h1>Корпорація «ОБРІЙ»</h1>
    </header>
    <nav aria-label="Основна навігація">
        <a href="index.html">Головна</a> |
        <a href="activities.html">Напрями діяльності</a> |
        <a href="feedback.html" aria-current="page">Зворотній зв’язок</a>
    </nav>
    <main>
        <h2>Зворотній зв’язок</h2>
        <p>Навчальна форма: дані перевіряються у браузері й нікуди не надсилаються.</p>
        <form id="feedback-form">
            <fieldset>
                <legend>Персональна інформація</legend>
                <p>
                    <label for="full-name">Прізвище та ім’я</label><br>
                    <input type="text" id="full-name" name="full_name" autocomplete="name" maxlength="100" required>
                </p>
                <p>
                    <label for="email">E-mail</label><br>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </p>
                <p>
                    <label for="age">Вік</label><br>
                    <input type="number" id="age" name="age" min="1" max="120" required>
                </p>
                <p>
                    <label for="education">Освіта</label><br>
                    <select id="education" name="education" required>
                        <option value="">Оберіть освіту</option>
                        <option value="complete">Повна</option>
                        <option value="incomplete">Неповна</option>
                        <option value="higher">Вища</option>
                        <option value="professional">Професійна</option>
                    </select>
                </p>
            </fieldset>
            <p>
                <label for="purpose">Мета зворотнього зв’язку</label><br>
                <select id="purpose" name="purpose" required>
                    <option value="">Оберіть мету</option>
                    <option value="cooperation">Співпраця</option>
                    <option value="complaint">Скарга на порушення права власності</option>
                    <option value="suggestion">Пропозиція</option>
                    <option value="error">Наявність помилки</option>
                </select>
            </p>
            <p>
                <label for="details">Детально (до 1000 символів)</label><br>
                <textarea id="details" name="details" rows="6" cols="45" maxlength="1000" required></textarea>
            </p>
            <p>
                <label><input type="checkbox" name="consent" value="yes" required> Даю згоду на обробку інформації</label>
            </p>
            <button type="submit">Відправити</button>
            <button type="reset">Очистити</button>
            <noscript><p>Для демонстрації відправлення увімкніть JavaScript.</p></noscript>
        </form>
        <p id="form-result" role="status"></p>
        <p><a href="index.html">На головну сторінку</a></p>
    </main>
    <footer><p>Навчальний сайт корпорації «ОБРІЙ».</p></footer>
</body>
</html>
